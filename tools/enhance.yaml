# Enhancement rules for ensure_enhancements.py.
# meta: .. meta:: field rules (severity and optional default values).
# after_title: mapping of directive name → rules for post-title insertion (YAML key order).
# Sphinx expands {PRODUCT} and {DISTRO} at build time (see conf.py).
meta:
  product:
    severity: warning
    value: "{PRODUCT}"
  distribution:
    severity: warning
    value: "{DISTRO}"
  area:
    severity: error
    value:
  experience:
    severity: warning
    value:
  content-type:
    severity: warning
    value:

after_title:
  short-description:
    severity: warning
    content: first_paragraph
  showmeta:
    severity: warning
    options:
      order: area, content-type, experience
    required_options:
      - order
