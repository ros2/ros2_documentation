name: Enhance

# pull_request_target grants GITHUB_TOKEN write access on fork PRs.
# PR code is checked out as data only; scripts run from the trusted base checkout.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-meta-tags:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Checkout trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --no-warn-script-location pyyaml

      - name: Ensure documentation metadata
        id: ensure
        continue-on-error: true
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DIFF_BASE"
          make -f .trusted-base/Makefile ensure-meta-tags \
            TOOLS_DIR=.trusted-base/tools \
            DIFF_BASE="$DIFF_BASE" \
            STATUS_FILE="$GITHUB_OUTPUT"

      # The ensure step soft-fails whenever metadata is missing, so an empty
      # meta_checked is the only signal that the check itself never ran.
      - name: Verify metadata check ran
        if: steps.ensure.outputs.meta_checked == ''
        run: |
          echo "The metadata check produced no outputs; see the ensure step log."
          exit 1

      - name: Supersede stale meta-tag reviews
        if: steps.ensure.outputs.meta_checked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          make -f .trusted-base/Makefile supersede-meta-tag-reviews \
            TOOLS_DIR=.trusted-base/tools

      # Carries the file-level "Commit suggestion" comments. Its review body is a
      # stamped pointer only, because the action posts nothing at all when every
      # suggestion duplicates one from an earlier run.
      - name: Suggest meta tag changes
        if: >-
          ${{ !cancelled()
          && steps.ensure.outputs.inline_suggestions == 'true' }}
        uses: parkerbxyz/suggest-changes@v3
        with:
          comment: ${{ steps.ensure.outputs.suggestion_note }}
          event: COMMENT

      # Always posts the summary so the Conversation view has a current review
      # after the stale ones are minimised, whatever suggest-changes did.
      - name: Post meta tag review comment
        if: >-
          ${{ !cancelled()
          && steps.ensure.outputs.has_results == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_COMMENT: ${{ steps.ensure.outputs.comment }}
        run: |
          set -euo pipefail
          gh pr review "$PR_NUMBER" \
            --comment \
            --body "$REVIEW_COMMENT"

      - name: Enforce required metadata
        if: always() && steps.ensure.outputs.has_errors == 'true'
        run: |
          echo "Required metadata (error severity) is still missing."
          exit 1
