name: Enhance

# pull_request_target grants GITHUB_TOKEN write access on fork PRs.
# PR code is checked out as data only; scripts run from the trusted base checkout.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-meta-tags:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Checkout trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --no-warn-script-location pyyaml

      - name: Ensure product and distribution meta tags
        id: ensure
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$BASE_SHA"

          mapfile -t changed_rst < <(
            git diff --name-only --diff-filter=ACMR \
              "${BASE_SHA}...${{ github.event.pull_request.head.sha }}" \
              -- '*.rst'
          )

          if [ "${#changed_rst[@]}" -eq 0 ]; then
            echo "No changed RST files in this pull request."
            echo "suggestable=false" >> "$GITHUB_OUTPUT"
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 .trusted-base/tools/ensure_meta_tags.py \
            --config .trusted-base/tools/meta_tags.yaml \
            --diff-base "$BASE_SHA" \
            --status-file "$GITHUB_OUTPUT" \
            "${changed_rst[@]}"

          echo "Working tree after ensure_meta_tags:"
          git status --short -- "${changed_rst[@]}"
          git diff -- "${changed_rst[@]}"

      - name: Suggest meta tag changes
        if: steps.ensure.outputs.suggestable == 'true'
        uses: parkerbxyz/suggest-changes@v3
        with:
          comment: ${{ steps.ensure.outputs.comment }}
          event: COMMENT

      - name: Comment fallback meta tag instructions
        if: >-
          steps.ensure.outputs.fallback == 'true'
          && steps.ensure.outputs.suggestable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_COMMENT: ${{ steps.ensure.outputs.comment }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --comment \
            --body "$REVIEW_COMMENT"
