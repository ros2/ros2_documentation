name: Enhance

# pull_request_target grants GITHUB_TOKEN write access on fork PRs.
# PR code is checked out as data only; scripts run from the trusted base checkout.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-meta-tags:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Checkout trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --no-warn-script-location pyyaml

      - name: Ensure documentation metadata
        id: ensure
        continue-on-error: true
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DIFF_BASE"
          make -f .trusted-base/Makefile ensure-meta-tags \
            TOOLS_DIR=.trusted-base/tools \
            DIFF_BASE="$DIFF_BASE" \
            STATUS_FILE="$GITHUB_OUTPUT"

      - name: Supersede stale meta-tag reviews
        id: supersede
        if: steps.ensure.outputs.meta_checked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_RESULTS: ${{ steps.ensure.outputs.has_results }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          make -f .trusted-base/Makefile supersede-meta-tag-reviews \
            TOOLS_DIR=.trusted-base/tools \
            STATUS_FILE="$GITHUB_OUTPUT"

      - name: Suggest meta tag changes
        if: >-
          steps.supersede.outputs.should_post == 'true'
          && steps.ensure.outputs.inline_suggestions == 'true'
        uses: parkerbxyz/suggest-changes@v3
        with:
          comment: ${{ steps.ensure.outputs.comment }}
          event: COMMENT

      - name: Post meta tag review comment
        if: >-
          steps.supersede.outputs.should_post == 'true'
          && steps.ensure.outputs.review_comment == 'true'
          && steps.ensure.outputs.inline_suggestions != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_COMMENT: ${{ steps.ensure.outputs.comment }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --comment \
            --body "$REVIEW_COMMENT"

      - name: Enforce required metadata
        if: always() && steps.ensure.outputs.has_errors == 'true'
        run: |
          echo "Required metadata (error severity) is still missing."
          exit 1
