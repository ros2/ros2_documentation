name: Enhance

# pull_request_target grants GITHUB_TOKEN write access on fork PRs.
# PR code is checked out as data only; scripts run from the trusted base checkout.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-meta-tags:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Checkout trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --no-warn-script-location pyyaml

      - name: Ensure documentation metadata
        id: ensure
        continue-on-error: true
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$BASE_SHA"

          # Collect changed RST files
          mapfile -t changed_rst < <(
            git diff --name-only --diff-filter=ACMR \
              "${BASE_SHA}...${{ github.event.pull_request.head.sha }}" \
              -- '*.rst'
          )

          if [ "${#changed_rst[@]}" -eq 0 ]; then
            echo "No changed RST files in this pull request."
            echo "meta_checked=false" >> "$GITHUB_OUTPUT"
            echo "suggestable=false" >> "$GITHUB_OUTPUT"
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check meta tags for changed RST files
          python3 .trusted-base/tools/ensure_meta_tags.py \
            --config .trusted-base/tools/meta_tags.yaml \
            --diff-base "$BASE_SHA" \
            --status-file "$GITHUB_OUTPUT" \
            "${changed_rst[@]}"

          echo "Working tree after ensure_meta_tags:"
          git status --short -- "${changed_rst[@]}"
          git diff -- "${changed_rst[@]}"

      - name: Supersede stale meta-tag reviews
        id: supersede
        if: steps.ensure.outputs.meta_checked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_RESULTS: ${{ steps.ensure.outputs.has_results }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          MARKER="ros2-meta-tags-ensure"

          echo "Marking prior meta-tag reviews as outdated."

          # Find all previous PR reviews containing the meta-tag marker,
          # and extract their node IDs
          mapfile -t review_ids < <(
            gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
              --jq ".[] | select(.body != null and (.body | contains(\"${MARKER}\"))) | .node_id"
          )

          # Prepare a GraphQL mutation string to minimize comments (mark them as outdated)
          minimize_query='
            mutation($subjectId: ID!) {
              minimizeComment(input: {
                subjectId: $subjectId
                classifier: OUTDATED
              }) {
                minimizedComment { isMinimized }
              }
            }
          '

          # Run the GraphQL mutation for each eligible review
          for node_id in "${review_ids[@]}"; do
            [ -z "$node_id" ] && continue
            gh api graphql \
              -f query="${minimize_query}" \
              -f subjectId="${node_id}" \
              || true
          done

          if [ "$HAS_RESULTS" = "true" ]; then
            echo "should_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "All meta-tag issues resolved; not posting a new review."
            echo "should_post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Suggest meta tag changes
        if: >-
          steps.supersede.outputs.should_post == 'true'
          && steps.ensure.outputs.suggestable == 'true'
        uses: parkerbxyz/suggest-changes@v3
        with:
          comment: ${{ steps.ensure.outputs.comment }}
          event: COMMENT

      - name: Comment fallback meta tag instructions
        if: >-
          steps.supersede.outputs.should_post == 'true'
          && steps.ensure.outputs.fallback == 'true'
          && steps.ensure.outputs.suggestable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_COMMENT: ${{ steps.ensure.outputs.comment }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --comment \
            --body "$REVIEW_COMMENT"

      - name: Enforce required metadata
        if: always() && steps.ensure.outputs.has_errors == 'true'
        run: |
          echo "Required metadata (error severity) is still missing."
          exit 1
