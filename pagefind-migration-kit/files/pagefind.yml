# Pagefind CLI indexing options (loaded when running `make pagefind` from repo root).
# Sphinx also reads this file; the Pagefind CLI ignores keys it does not recognize.

# Exclude Sphinx heading permalink anchors from the search index.
# Without this, Pagefind title metadata includes the headerlink glyph ().
exclude_selectors:
  - a.headerlink

# Sphinx-only: order + labels for search result metadata and facet sidebar.
# Keys must match .. meta:: field names on each page.
search_result_meta:
  product: Product
  distribution: Distribution
  area: Area
  capability: Capability
  community: Community
  installation: Installation
  framework: Framework
  tool: Tools
  contentType: Content type
  experience: Level

# Facet keys that always appear in the filter sidebar, even when no indexed
# page has that .. meta:: field yet (empty placeholder sections).
# Keys must also appear under search_result_meta.
always_show_filters:
  - product
  - distribution
  - area
  - capability
  - community
  - installation
  - framework
  - tool
  - contentType
  - experience
